name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      USE_SQLITE_FOR_TESTS: "true"
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ci-only-secret
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      LIVEKIT_URL: ws://localhost:7880
      LIVEKIT_API_KEY: ci-key
      LIVEKIT_API_SECRET: ci-secret-ci-secret-ci-secret-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt ruff
      # Erreurs graves uniquement (syntaxe, noms non définis) : pas de bruit de style
      - run: ruff check --select E9,F63,F7,F82 .
      - run: python manage.py check
      # Le code 5 de pytest signifie « aucun test trouvé » : on ne le traite pas comme un échec
      - run: pytest -q || [ $? -eq 5 ]

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npx oxlint .
      - run: npm run build
      - run: npm test

  ai-service:
    name: Service IA (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements-ci.txt
      # Version allégée sans torch : les tests remplacent l'inférence par un faux modèle
      - run: pip install -r requirements-ci.txt
      - run: pytest -q

  compose:
    name: Validation docker compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose -f docker-compose.yml -f docker-compose.mlops.yml config -q

  docker:
    name: Build image ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [backend, frontend, ai-service, compose]
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend, ai-service, agent, stt-service]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
