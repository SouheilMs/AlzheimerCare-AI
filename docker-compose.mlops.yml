# Services MLOps / monitoring, à lancer EN PLUS du docker-compose.yml :
#   docker compose -f docker-compose.yml -f docker-compose.mlops.yml up -d --build
services:
  mlflow:
    container_name: Alzheimers-MLflow
    build: ./infra/mlflow
    command: >
      mlflow server
      --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
    volumes:
      - mlflow_data:/mlflow
    ports:
      - "5000:5000"

  n8n:
    container_name: Alzheimers-n8n
    image: docker.n8n.io/n8nio/n8n:latest # épinglez une version précise avant la soutenance
    environment:
      GENERIC_TIMEZONE: Africa/Tunis
      TZ: Africa/Tunis
      N8N_PORT: "5678"
      # Permet aux workflows de lire INTERNAL_API_TOKEN avec {{ $env.INTERNAL_API_TOKEN }}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./infra/n8n/workflows:/workflows:ro
    ports:
      - "5678:5678"
    depends_on:
      - backend

  prometheus:
    container_name: Alzheimers-Prometheus
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - ai-service

  grafana:
    container_name: Alzheimers-Grafana
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  mlflow_data:
  n8n_data:
  prometheus_data:
  grafana_data:
