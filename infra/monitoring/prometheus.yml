global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Service IA : endpoint /metrics ajouté dans ai-service/main.py
  - job_name: ai-service
    metrics_path: /metrics
    static_configs:
      - targets: ["ai-service:8001"]

  # Django : nécessite django-prometheus (voir INSTALL.md, étape monitoring)
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  # Keycloak : KC_METRICS_ENABLED=true, métriques sur le port de gestion 9000
  - job_name: keycloak
    metrics_path: /metrics
    static_configs:
      - targets: ["keycloak:9000"]
